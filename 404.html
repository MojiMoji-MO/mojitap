<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

  <title>Page Not Found | Mojitap</title>

  <meta
    content="The page you are looking for could not be found."
    name="description"/>

  <meta
    content="noindex, follow"
    name="robots"/>

  <link
    href="/mojitap-favicon.png"
    rel="icon"
    type="image/png"/>

  <link
    href="/style.css"
    rel="stylesheet"/>

  <style>
    .not-found-box {
      text-align: center;
      padding: 60px 24px;
    }

    .not-found-code {
      margin: 0 0 12px;
      font-size: 64px;
      line-height: 1;
      font-weight: 800;
    }

    .not-found-box h1 {
      margin: 0 0 16px;
    }

    .not-found-box p {
      max-width: 620px;
      margin: 0 auto 28px;
      color: var(--text-muted, #667085);
      line-height: 1.8;
    }

    .not-found-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    @media (max-width: 640px) {
      .not-found-code {
        font-size: 48px;
      }

      .not-found-actions {
        flex-direction: column;
      }

      .not-found-actions .back-btn {
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
</head>

<body>

<div class="app-container">

  <div id="header-placeholder"></div>

  <main class="content-box">

    <section class="not-found-box">

      <div class="not-found-code">404</div>

      <h1>Page Not Found</h1>

      <p>
        The page you are looking for may have been removed,
        renamed, or replaced by a newer Mojitap guide.
        You can return to the homepage, browse emojis,
        or view the latest emoji guides.
      </p>

      <div class="not-found-actions">

        <a
          class="back-btn"
          href="/">
          Go to Mojitap
        </a>

        <a
          class="back-btn"
          href="/all-emojis"
          style="background-color: var(--palette-bg, #f8fafc); color: var(--text-main, #1f2937);">
          Browse All Emojis
        </a>

        <a
          class="back-btn"
          href="/blog"
          style="background-color: var(--palette-bg, #f8fafc); color: var(--text-main, #1f2937);">
          View Emoji Guides
        </a>

      </div>

    </section>

  </main>

  <div id="footer-placeholder"></div>

</div>

<script src="/layout.js"></script>

<script>
  window.addEventListener('load', function () {
    if (typeof initLayout === 'function') {
      initLayout('');
    }
  });
</script>

</body>
</html>
